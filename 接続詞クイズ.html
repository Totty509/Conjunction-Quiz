<style>*{box-sizing:border-box}body{margin:0;background:#f7f5ed;color:#183f38;font:16px/1.7 system-ui,sans-serif}header{padding:17px max(5vw,calc((100vw - 780px)/2));background:#17493f;color:white;white-space:nowrap;font-weight:750}main{max-width:780px;margin:7vh auto;padding:0 18px}article{border:1px solid #cdd7cc;background:#fffef9;border-radius:18px;padding:clamp(20px,5vw,45px);box-shadow:0 6px 22px #17392d09}h1{font-size:clamp(24px,5vw,36px);line-height:1.3;margin:8px 0 20px}small{color:#547368;font-weight:700}p{white-space:pre-line}h2{font:600 clamp(20px,4vw,27px)/1.55 Georgia,serif;white-space:pre-line}button,select,input,textarea{font:inherit;border-radius:9px;border:1px solid #aec6ba;padding:10px 16px;margin:4px 5px 4px 0;max-width:100%}button{cursor:pointer;background:#fff;color:#194f40}button:hover,button:focus-visible{background:#e6f3e8}button.primary{background:#1b604d;color:white}button.choice{display:block;width:100%;text-align:left}textarea{width:100%}aside{margin-top:18px}footer{padding:14px 0}#msg{font-weight:700;color:#774217}progress{accent-color:#287657;width:100%}main{background:#fffef9;border:1px solid #ccd8cd;border-radius:18px;padding:clamp(18px,5vw,40px);width:calc(100% - 28px)}.hint{background:#edf5e9;border-left:4px solid #69966f;padding:12px}.notice{font-weight:700;color:#8d4616}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.levels button{padding:18px}label{display:block}progress{display:block;margin:10px 0}h1:focus{outline:none}button.choice{margin-top:8px}</style>
<header>英文法クエスト　／　接続詞</header><main></main><script>
const rows=[{"q": "Jim's Japanese was not very good, (　　) his speech still impressed the audience.", "opts": ["because", "but", "so", "therefore"], "key": "2", "uni": "京都産大", "rule": "逆接。予想に反する内容を続ける。so は結果を表す。", "jp": "日本語はあまり上手ではなかったが、ジムのスピーチは聴衆に感銘を与えた。", "lv": 2, "id": 327, "clues": ["日本語の上手さと、聴衆の反応を比べよう。", "「上手ではなかった。＿＿、感動させた」。予想が外れるつなぎ方は？"]}, {"q": "I can't speak French, (　　) can I read it.", "opts": ["but", "also", "nor", "although"], "key": "3", "uni": "千葉工大", "rule": "否定文＋nor＋助動詞＋主語。but だけでは倒置しない。", "jp": "フランス語を話せないし、読むこともできない。", "lv": 3, "id": 328, "clues": ["話すことと読むことは、それぞれできる？", "後半は can I の順。「～もできない」を倒置で加えよう。"]}, {"q": "I was not familiar with the town, (　　) I managed to get to the hotel.", "opts": ["already", "so", "then", "yet"], "key": "4", "uni": "藤女子大", "rule": "yet は「それでも」。so は結果、then は順序を表す。", "jp": "その町に不慣れだったが、なんとかホテルに着いた。", "lv": 3, "id": 329, "clues": ["町に不慣れなら、ホテルに着くのは簡単かな？", "不慣れだった。「それでも」着けた、という流れ。"]}, {"q": "Let him start the work at once, (　　) he won't be able to finish it by five.", "opts": [], "key": "or/otherwise", "uni": "大妻女子大", "rule": "命令文＋or は「さもないと」。and は「そうすれば」。", "jp": "すぐ彼に仕事を始めさせなさい。さもないと5時までに終えられない。", "lv": 4, "id": 330, "clues": ["後半は、5時までに終わらないという警告。", "「今すぐ始めなさい。さもないと…」を作ろう。"]}, {"q": "(a) If you study harder, you will pass the examination. (b) Study harder, (　　) you will pass the examination.", "opts": ["and", "or", "but", "if"], "key": "1", "uni": "朝日大", "rule": "命令文＋and は「そうすれば」。or は指示に従わない場合を示す。", "jp": "もっと勉強しなさい。そうすれば試験に合格する。", "lv": 3, "id": 331, "clues": ["(b)でも(a)と同じ合格条件を伝えよう。", "命令に従った結果を「そうすれば」で続けよう。"]}, {"q": "Smoking is (　　) expensive and bad for your health.", "opts": [], "key": "both", "uni": "駒澤大", "rule": "both A and B は「AもBも」。二つの特徴を並べる。", "jp": "喫煙はお金がかかり、健康にも悪い。", "lv": 3, "id": 332, "clues": ["高くつくことと健康に悪いことはいくつの特徴？", "後ろの and と組にして「両方とも」を表そう。"]}, {"q": "He is not a scholar (　　) a writer.", "opts": ["and", "also", "but", "than"], "key": "3", "uni": "岐阜聖徳学園大", "rule": "not A but B は A を否定し、B を肯定する。", "jp": "彼は学者ではなく作家だ。", "lv": 3, "id": 333, "clues": ["学者と作家のうち、否定されているのはどちら？", "前の説明を取り消し「そうではなく作家だ」と訂正する。"]}, {"q": "This book is not only more instructive (　　) more interesting than that book.", "opts": ["that", "or", "nor", "but"], "key": "4", "uni": "関東学院大", "rule": "not only A but (also) B。AにBを付け加える。", "jp": "この本はあの本よりためになるだけでなく、おもしろい。", "lv": 3, "id": 334, "clues": ["二冊の本を、役立ち度と面白さで比べている。", "not only で始まった「～だけでなく…も」を完成させよう。"]}, {"q": "To get to the sports arena, you can take (　　) the bus or the train.", "opts": ["either", "neither", "both", "nor"], "key": "1", "uni": "東海大", "rule": "either A or B は「AかB」。both は and と組む。", "jp": "競技場へはバスか電車のどちらかで行ける。", "lv": 3, "id": 335, "clues": ["バスと電車は、両方に乗る必要がある？", "後ろの or と組み合わせて「どちらか」を表そう。"]}, {"q": "(　　) my father nor my brother smokes.", "opts": ["Either", "Both", "Neither", "Not only"], "key": "3", "uni": "芝浦工大", "rule": "neither A nor B は両方を否定する。動詞は近い主語に合わせる。", "jp": "父も兄もたばこを吸わない。", "lv": 3, "id": 336, "clues": ["父と兄のうち、たばこを吸うのは何人？", "後ろに nor がある。「両方とも～ない」の組を作ろう。"]}, {"q": "Do you have to eat the whole of a bad egg to know (　　) it is bad?", "opts": ["when", "that", "what", "which"], "key": "2", "uni": "中部大", "rule": "that の後には要素のそろった文が続く。what は節の中で主語や目的語などになる。", "jp": "卵が腐っていると知るのに、全部食べる必要があるだろうか。", "lv": 4, "id": 337, "clues": ["it is bad は、それだけで文になる？", "know の後に「腐っているということ」をひとまとまりで置こう。"]}, {"q": "I could not believe the fact (　　) California used to belong to Mexico.", "opts": ["why", "how", "that", "which"], "key": "3", "uni": "日本女子大", "rule": "the fact that＋文。「事実」の中身を説明する同格。which が入るための欠けがない。", "jp": "カリフォルニアがかつてメキシコ領だったという事実を信じられなかった。", "lv": 3, "id": 338, "clues": ["California 以下はどんな事実だったかを説明している。", "後ろの文に欠けはない。fact の中身を導く語を選ぼう。"]}, {"q": "I doubt (　　) we'll finish in time for Christmas.", "opts": ["how", "if", "when", "why"], "key": "2", "uni": "中部大", "rule": "doubt の目的語に if＋文。「…かどうか」。when は時を尋ねる。", "jp": "クリスマスに間に合うように終えられるか疑わしい。", "lv": 4, "id": 339, "clues": ["気になっているのは、方法・理由・間に合うかどうかのどれ？", "doubt の目的語になる「～かどうか」を探そう。"]}, {"q": "(　　) you should stop smoking is the biggest decision you have to make.", "opts": ["If", "Unless", "While", "Whether"], "key": "4", "uni": "学習院女子大", "rule": "Whether＋文が主語。「…かどうか」を主語にするときは if を使えない。", "jp": "禁煙すべきかどうかが、あなたのしなければならない最大の決断だ。", "lv": 4, "id": 340, "clues": ["最初の空欄から smoking までをひとまとめにしよう。", "「禁煙すべきかどうか」全体が is の主語になっている。"]}, {"q": "He is a good writer (　　) he has an elegant style.", "opts": ["that", "in which", "if that", "in that"], "key": "4", "uni": "松山大", "rule": "in that＋文で「…という点で」。評価の根拠を示す。", "jp": "彼は優雅な文体を持つという点で優れた作家だ。", "lv": 4, "id": 341, "clues": ["文体についての説明は、作家への評価とどうつながる？", "「優雅な文体を持つという点で」と読めるまとまりを探そう。"]}, {"q": "Let me know at once (　　) you have finished it.", "opts": ["when", "until", "for", "so that"], "key": "1", "uni": "中京大", "rule": "when は出来事が起きる時、until は継続の終点を示す。", "jp": "それを終えたらすぐに知らせて。", "lv": 2, "id": 342, "clues": ["何が起きたときに知らせてほしい？", "終えた時点で知らせる。知らせ続ける期間ではないよ。"]}, {"q": "I haven't seen Rich (　　) he returned from New Zealand.", "opts": ["as", "since", "when", "until"], "key": "2", "uni": "東海大", "rule": "現在完了＋since＋過去形。過去の出来事を起点とする。", "jp": "リッチがニュージーランドから帰って以来、彼に会っていない。", "lv": 2, "id": 343, "clues": ["帰国した時点と、今とのつながりを考えよう。", "現在完了に続けて「帰国して以来」という起点を示そう。"]}, {"q": "It's been ages (　　).", "opts": ["since I last played tennis", "that I haven't played tennis", "after I didn't play tennis", "that I don't play tennis"], "key": "1", "uni": "名古屋工大", "rule": "It has been＋期間＋since＋過去形。起点からの長さを示す。", "jp": "最後にテニスをしてからずいぶんたつ。", "lv": 3, "id": 344, "clues": ["ages はここでは「長い時間」。どこからの長さ？", "「最後にテニスをした」という過去の出来事を起点にしよう。"]}, {"q": "You had better write it down (　　) you forget it.", "opts": ["after", "before", "whether", "while"], "key": "2", "uni": "京都学園大", "rule": "before＋肯定文で「…しないうちに」。after は順序が逆。", "jp": "忘れないうちに書き留めておいたほうがよい。", "lv": 3, "id": 345, "clues": ["書き留めるのと忘れるのと、どちらが先？", "「忘れないうちに」は「忘れるより前に」と言い換えよう。"]}, {"q": "It ( with him / before / be / won't / catch / I / up / long ).", "opts": [], "key": "won't be long before I catch up with him", "uni": "東京家政大", "rule": "It won't be long before＋文。「まもなく…する」。時を表す節は未来のことも現在形。", "jp": "まもなく私は彼に追いつく。", "lv": 4, "id": 346, "clues": ["追いつくまでに長い時間がかかるのかな？", "It の後に「長くはかからない」を作り、次に「追いつく」を置こう。"]}, {"q": "(　　) I met John, he was still a college student.", "opts": ["At first", "For the first time", "In the first", "The first time"], "key": "4", "uni": "聖学院大", "rule": "The first time＋主語＋動詞。At first は「最初のうちは」で文をつなげない。", "jp": "初めてジョンに会ったとき、彼はまだ大学生だった。", "lv": 4, "id": 347, "clues": ["空欄の後に I met John という文がある。", "「初めて会ったとき」と、後ろの文までつなげる表現を選ぼう。"]}, {"q": "There won't be any train service (　　) this terrible snowstorm is over.", "opts": ["by the time", "while", "since", "until"], "key": "4", "uni": "法政大", "rule": "until は状態が続く終点。by the time は完了の期限。", "jp": "このひどい吹雪が収まるまで列車は運行しない。", "lv": 4, "id": 348, "clues": ["列車が動かない状態はいつ終わる？", "吹雪が収まる時点まで、その状態がずっと続く。"]}, {"q": "(　　) you are fifty, the world will have greatly changed.", "opts": ["Until", "Since", "By the time", "While"], "key": "3", "uni": "横浜市立大", "rule": "by the time＋文は「…するまでには」。未来完了が変化の完了を示す。", "jp": "あなたが50歳になるまでには世界は大きく変わっているだろう。", "lv": 3, "id": 349, "clues": ["will have changed は、ある時点で変化が済んでいる形。", "「50歳になるまでには」と完了の期限を示そう。"]}, {"q": "She said no every time, (　　) at the last moment she suddenly agreed to take us.", "opts": ["until", "by", "during", "where"], "key": "1", "uni": "亜細亜大", "rule": "コンマの後の until が、それまでの状態が変わる出来事を導く。「そしてついに」。", "jp": "彼女は毎回断ったが、最後の最後に突然私たちを連れていくことに同意した。", "lv": 5, "id": 350, "clues": ["断り続けた後、最後に何が変わった？", "拒否が続いた期間の終点に、突然の承諾がある。"]}, {"q": "You cannot ( of / health / appreciate / until / the importance ) you are ill.", "opts": [], "key": "appreciate the importance of health until", "uni": "九州産大", "rule": "not ... until は「…して初めて～する」。until の後に転機を置く。", "jp": "病気になって初めて健康の大切さがわかる。", "lv": 4, "id": 351, "clues": ["「健康の大切さ」をひとまとまりにしよう。", "cannot の後は動詞の原形。「病気になるまでわからない」の順に並べよう。"]}, {"q": "I left the house (　　) I heard the news.", "opts": ["as soon as", "during", "until", "while"], "key": "1", "uni": "早稲田大", "rule": "as soon as＋文で「…するとすぐ」。while は同時に続く動作を示す。", "jp": "知らせを聞くとすぐに家を出た。", "lv": 2, "id": 352, "clues": ["知らせを聞くことと外出の時間差に注目。", "「聞くとすぐに」を表し、後ろに文を続けられる語句は？"]}, {"q": "(a) I had hardly left the building when I was asked some questions by a police officer. (b) The (　　) I left the building, I was asked some questions by a police officer.", "opts": ["instance", "moment", "time", "sooner"], "key": "2", "uni": "駒澤大", "rule": "the moment＋文。「…したとたん」。instance は「事例」。", "jp": "建物を出たとたん警察官にいくつか質問された。", "lv": 3, "id": 353, "clues": ["(a)では、外に出てから質問されるまでがごく短い。", "The の後に「瞬間」を意味する名詞を置こう。"]}, {"q": "I will go away ( directly / me / tell / to / you ).", "opts": [], "key": "directly you tell me to", "uni": "東京理大", "rule": "directly＋文は「…するとすぐ」。文末の to の後は go away が省略されている。", "jp": "あなたが私に出ていくよう言えばすぐに出ていきます。", "lv": 5, "id": 354, "clues": ["まず「あなたが私に言う」を作ろう。", "「～するとすぐ」の語の後に主語＋動詞。最後は go away の繰り返しを省く。"]}, {"q": "I had no sooner uttered the words (　　) I regretted them.", "opts": ["that", "than", "if", "as"], "key": "2", "uni": "佛教大", "rule": "no sooner ... than は「…するとすぐ」。比較級 sooner と than の組み合わせ。", "jp": "その言葉を口にするとすぐに後悔した。", "lv": 4, "id": 355, "clues": ["発言と後悔が立て続けに起きている。", "no sooner の sooner は比較級。比較級と組になる語は？"]}, {"q": "(　　) he entered the room when they stopped laughing.", "opts": ["Hardly had", "Had hardly", "On having", "Having had"], "key": "1", "uni": "松山大", "rule": "Hardly had＋主語＋過去分詞＋when。否定的な副詞が文頭に出て倒置する。", "jp": "彼が部屋に入るやいなや彼らは笑うのをやめた。", "lv": 4, "id": 356, "clues": ["入室した直後、笑い声が止まった。", "否定に近い副詞が文頭に出ると、助動詞が主語の前に出る。"]}, {"q": "Let's try to do our best, (　　) we can expect no help from anyone else.", "opts": ["since", "unless", "that", "what"], "key": "1", "uni": "桃山学院大", "rule": "since＋文で理由を示す。unless は条件を示す。", "jp": "他の誰からの援助も期待できないのだから、最善を尽くそう。", "lv": 3, "id": 357, "clues": ["誰にも助けを期待できないことは、前半の何にあたる？", "「助けは期待できないから、最善を尽くそう」という理由の関係。"]}, {"q": "I hardly recognized you, (　　) you've changed so much.", "opts": ["because", "that", "even if", "although"], "key": "1", "uni": "湘南工科大", "rule": "because＋文で理由を示す。although は予想に反する結果につなぐ。", "jp": "ずいぶん変わったので、ほとんどあなただとわからなかった。", "lv": 3, "id": 358, "clues": ["気づかなかったのは、相手がどう変わったから？", "後半は「なぜ気づかなかったのか」の答えになっている。"]}, {"q": "A man is not great (　　) he knows many things.", "opts": ["for", "as", "because", "since"], "key": "3", "uni": "実践女子大", "rule": "not ... because は理由を否定できる。ここでは「…だからといって～ではない」。", "jp": "多くを知っているからといって人は偉いわけではない。", "lv": 3, "id": 359, "clues": ["「知識が多い人は必ず偉い」と言っているのかな？", "「～だからといって偉いわけではない」。理由づけを否定する形を考えよう。"]}, {"q": "(　　) you sow at the right time, you cannot expect a rich harvest.", "opts": ["Whenever", "If", "Unless", "Wherever"], "key": "3", "uni": "西南学院大", "rule": "unless は「…しない限り」。if ... not に近い。", "jp": "適切な時期に種をまかなければ、豊作は見込めない。", "lv": 3, "id": 360, "clues": ["豊作のために欠かせない条件は何？", "「適切な時期にまかない限り」と、条件を否定する語を探そう。"]}, {"q": "I will forgive him (　　) he acknowledges his mistakes.", "opts": ["provided", "otherwise", "nevertheless", "however"], "key": "1", "uni": "青山学院大", "rule": "provided (that)＋文で条件を示す。otherwise は「さもないと」。", "jp": "彼が自分の間違いを認めるなら許そう。", "lv": 5, "id": 361, "clues": ["許すために相手に求めていることは何？", "「間違いを認めるという条件で」。後ろに文を直接続ける語を選ぼう。"]}, {"q": "I'll lend you the money (　　) condition that you return it within six months.", "opts": ["with", "for", "in", "on"], "key": "4", "uni": "玉川大", "rule": "on condition that＋文。「…という条件で」。前置詞は on。", "jp": "6か月以内に返す条件でお金を貸そう。", "lv": 4, "id": 362, "clues": ["condition は「条件」。貸すための約束は何？", "「～という条件で」の決まった表現。condition の直前の前置詞を考えよう。"]}, {"q": "She behaves (　　) she were a queen.", "opts": ["although", "because", "so that", "as if"], "key": "4", "uni": "和洋女子大", "rule": "as if＋仮定法過去。「まるで…かのように」。were は現実と距離のある想像を示す。", "jp": "彼女はまるで女王のように振る舞う。", "lv": 3, "id": 363, "clues": ["彼女は本当に女王だと言っているのかな？", "she were に注目。「まるで～のように」という想像を導こう。"]}, {"q": "(　　) he has lived in Japan for some time, he cannot speak Japanese very well.", "opts": ["Although", "Even", "However", "Nevertheless"], "key": "1", "uni": "駿河台大", "rule": "Although＋主語＋動詞。「 }

function levels(previous){
 const group=add('div','',page,'levels');
 for(const lv of [2,3,4,5]){
  if(lv===previous)continue;

  action('Lv'+lv+'　'+count+'問',()=>prepare(lv), '',group);

}

function shuffle(items){
 for(let i=items.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [items[i],items[j]]=[items[j],items[i]];
 }
 return items;
}
function prepare(lv){

 add('h2','正解　'+(r.opts.length?'①②③④'[choiceOrder.indexOf(+r.key-1)]+' '+r.opts[+r.key-1]:r.q.includes(' / ')?complete(r,r.key):r.key.replace('/',' ／ ')));
 add('p',r.rule,page,'hint');add('p','【訳】'+r.jp);add('small','現在 '+total()+'点　／　目標 '+target()+'点');const bar=add('aside','');
 action(cursor+1===deck.length?'結果を見る':'次の問題へ',()=>{cursor++;if(cursor===deck.length)summary();else begin()},'primary',bar);
}
function summary(){
 reset();add('small','チャレンジ結果　／　全'+deck.length+'問');heading('Lv'+level+' チャレンジ終了！');
 add('h2',total()+' ／ '+deck.length*level+' 点');
 add('p',(total()>=target()?'目標達成！':'目標まであと'+(target()-total())+'点')+'　目標 '+target()+'点');
 add('p','自力で正解　'+results.filter(x=>x===level).length+'問\nヒントで正解　'+results.filter(x=>x===1).length+'問\n解説を確認　'+results.filter(x=>x===0).length+'問');
 const b=action('別のレベルで再度始める',()=>{b.disabled=true;add('p','次に挑戦するレベルを選ぼう。');levels(level)},'primary');
}
home();
